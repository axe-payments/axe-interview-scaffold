services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/code # source mounted -> uvicorn --reload picks up your edits live
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15.17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browse the database at http://localhost:8080
  # System: PostgreSQL | Server: postgres | User/Pass: postgres | Database: interview
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
